<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>时光列车 · 交互原型</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #263d42;
      --muted: #6f8584;
      --paper: #fffdf8;
      --teal: #167f81;
      --line: #dedfd5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at 50% 0, #fffaf0 0, #f1f4f1 55%, #e9efee 100%);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    button { font: inherit; }
    .shell { max-width: 1390px; margin: 0 auto; padding: 28px 40px 50px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; font-weight: 800; font-size: 18px; letter-spacing: .04em; }
    .brand-mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 12px; color: white; background: linear-gradient(135deg,#2878d2,#118b83); box-shadow: 0 5px 14px #2574a638; }
    .tabs { display: flex; align-items: center; gap: 3px; padding: 7px; background: #fffdfbe8; border: 1px solid #e2e9e7; border-radius: 16px; box-shadow: 0 8px 30px #496b7210; }
    .tabs span { padding: 12px 18px; color: #6d8090; font-size: 14px; font-weight: 700; white-space: nowrap; }
    .tabs .active { border-radius: 11px; color: white; background: linear-gradient(100deg,#2868cb,#087f80); box-shadow: 0 7px 18px #2868cb29; }
    .eyebrow { margin: 24px 0 8px; color: #548383; font-size: 12px; font-weight: 800; letter-spacing: .18em; }
    .headline { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 16px; }
    h1 { margin: 0; font-family: "Songti SC", "SimSun", serif; font-size: clamp(30px,3vw,42px); letter-spacing: .09em; }
    .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 14px; letter-spacing: .04em; }
    .concept-tag { align-self: end; border: 1px solid #cbdad5; padding: 8px 13px; border-radius: 99px; color: #638078; background: #f8fbf8; font-size: 12px; white-space: nowrap; }
    .carriage { position: relative; padding: 15px 15px 0; overflow: hidden; border-radius: 30px; background: linear-gradient(125deg,#7c5740,#a9815b 16%,#5c4538 45%,#987450 82%,#533b31); box-shadow: 0 25px 45px #3b555027, inset 0 0 0 2px #d6bd9273; }
    .window { position: relative; height: clamp(330px, 52vh, 510px); overflow: hidden; border: 8px solid #4e372d; border-radius: 20px 20px 13px 13px; background: #cdd5bf center 55% / cover no-repeat; box-shadow: inset 0 0 0 3px #efdfb6, inset 0 0 45px #2f4a3b4d; }
    .window:after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(100deg,#fff5d534 0,#ffffff00 30%,#ffffff00 64%,#fff7dc30 100%), linear-gradient(0deg,#2236243f 0,#22362400 26%); }
    .glass-label { position: absolute; z-index: 2; top: 22px; left: 26px; padding: 9px 14px; border: 1px solid #fffaf0a6; border-radius: 99px; color: #244947; background: #fffdf5d9; backdrop-filter: blur(8px); box-shadow: 0 4px 15px #3b634025; font-size: 13px; font-weight: 700; }
    .shelf { position: relative; z-index: 5; display: flex; justify-content: space-between; align-items: end; gap: 20px; min-height: 104px; padding: 0 35px 16px; background: linear-gradient(#c99f72 0,#aa784e 10%,#795538 40%,#4e392e 100%); box-shadow: inset 0 8px 10px #f5d2a368; }
    .ticket { position: relative; display: grid; grid-template-columns: 1fr 56px; width: min(390px, 56%); min-height: 126px; margin-top: -50px; overflow: hidden; border: 1px solid #dbd3be; border-radius: 12px; background: #fffdf7; box-shadow: 0 12px 18px #2b271f40; transform: rotate(-2deg); }
    .ticket-main { padding: 17px 18px 14px; }
    .ticket-kicker { color: #8a997f; font-size: 11px; font-weight: 800; letter-spacing: .15em; }
    .ticket-name { margin: 5px 0; font-family: "Songti SC", "SimSun", serif; font-size: 28px; font-weight: 800; letter-spacing: .14em; }
    .ticket-desc { color: #788681; font-size: 12px; }
    .ticket-side { display: grid; place-items: center; border-left: 1px dashed #d3cdbb; color: #699186; background: #f2f4e9; writing-mode: vertical-rl; font-size: 11px; font-weight: 800; letter-spacing: .12em; }
    .journal-trigger { display: flex; align-items: center; gap: 14px; min-width: 205px; margin-top: -65px; padding: 0; border: 0; color: #fffaf0; background: transparent; cursor: pointer; filter: drop-shadow(0 8px 8px #28211680); }
    .journal-trigger:hover .journal-book { transform: translateY(-6px) rotate(4deg); }
    .journal-book { display: grid; place-items: center; width: 85px; height: 106px; border: 6px solid #d4b685; border-left: 15px solid #587d71; border-radius: 5px 12px 12px 5px; color: #567e72; background: repeating-linear-gradient(#fff9ec 0 12px,#ecdec6 13px 14px); box-shadow: 3px 5px 0 #e1d1ac, 6px 8px 0 #b99c70; font-family: "Songti SC", "SimSun", serif; font-weight: 800; writing-mode: vertical-rl; transition: transform .2s ease; transform: rotate(4deg); }
    .journal-caption { padding-bottom: 16px; text-align: left; text-shadow: 0 1px 5px #241c1c; }
    .journal-caption strong { display: block; font-family: "Songti SC", "SimSun", serif; font-size: 18px; letter-spacing: .1em; }
    .journal-caption small { display: block; margin-top: 5px; opacity: .85; font-size: 11px; }
    .route-strip { display: flex; align-items: center; gap: 20px; margin: 20px 1px 0; padding: 16px 22px; border: 1px solid #e2e9e3; border-radius: 15px; background: #fffdfbe9; box-shadow: 0 8px 25px #5364600c; }
    .route-label { color: #87908a; font-size: 11px; font-weight: 800; letter-spacing: .11em; white-space: nowrap; }
    .route-line { display: flex; align-items: center; flex: 1; gap: 10px; color: #8d9994; font-size: 13px; }
    .route-line b { color: #257a77; }
    .rail { flex: 1; min-width: 25px; height: 2px; background: linear-gradient(90deg,#64a5a0,#bdcbc4); }
    .station-dot { width: 9px; height: 9px; border-radius: 50%; background: #258c84; box-shadow: 0 0 0 4px #e0f1e8; }
    .route-future { color: #9ba7a2; white-space: nowrap; }
    .below { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 20px; margin: 27px 4px 0; }
    .below h2 { margin: 0 0 7px; font-family: "Songti SC", "SimSun", serif; font-size: 20px; }
    .below p { margin: 0; color: #7f908c; font-size: 13px; }
    .today-button { padding: 11px 19px; border: 1px solid #d3e2dc; border-radius: 11px; background: #fffefa; color: #347c7a; font-weight: 700; }
    dialog { width: min(710px, calc(100vw - 32px)); padding: 0; border: 0; border-radius: 16px; color: var(--ink); background: #fdf8eb; box-shadow: 0 30px 90px #142c2a66; }
    dialog::backdrop { background: #162823b8; backdrop-filter: blur(5px); }
    .journal-open { display: grid; grid-template-columns: 1fr 1fr; min-height: 390px; }
    .journal-page { padding: 35px 32px; background: repeating-linear-gradient(#fdf9ee 0 31px,#dfd9c8 32px); }
    .journal-page + .journal-page { border-left: 3px solid #d7c8aa; background-color: #fffaf0; }
    .journal-page h2 { margin: 3px 0 24px; font-family: "Songti SC", "SimSun", serif; font-size: 27px; }
    .journal-page p { line-height: 2.1; color: #4e625c; }
    .journal-meta { color: #879588; font-size: 11px; font-weight: 800; letter-spacing: .15em; }
    .journal-handwriting { margin-top: 31px; color: #607f77; font-family: "KaiTi", serif; font-size: 20px; }
    .journal-close { position: absolute; top: 10px; right: 13px; border: 0; background: #fdf8eb; color: #53746c; font-size: 25px; cursor: pointer; }
    @media (max-width: 900px) {
      .shell { padding: 18px 16px 40px; }
      .topbar { display: block; }
      .tabs { margin-top: 16px; overflow-x: auto; }
      .tabs span { padding: 10px 13px; }
      .headline { margin-top: 20px; }
      .carriage { padding: 9px 9px 0; border-radius: 20px; }
      .window { height: 55vw; min-height: 320px; border-width: 5px; }
      .shelf { min-height: 92px; padding: 0 12px 12px; }
      .ticket { width: min(340px, 54%); min-height: 112px; }
      .journal-caption { display: none; }
      .journal-trigger { min-width: auto; }
    }
    @media (max-width: 570px) {
      .headline { align-items: start; }
      .concept-tag { display: none; }
      .window { height: 70vh; min-height: 430px; background-position: 54% center; }
      .glass-label { top: 13px; left: 12px; font-size: 11px; }
      .ticket { width: 66%; }
      .ticket-name { font-size: 22px; }
      .ticket-main { padding: 12px; }
      .journal-book { width: 65px; height: 85px; font-size: 12px; }
      .route-strip { align-items: start; }
      .route-line { flex-wrap: wrap; }
      .route-future { width: 100%; }
      .journal-open { grid-template-columns: 1fr; }
      .journal-page + .journal-page { border-left: 0; border-top: 3px solid #d7c8aa; }
    }
  </style>
  <link rel="stylesheet" href="./journey-prototype.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span> 象限时光</div>
      <nav class="tabs" aria-label="交互原型导航">
        <span>添加任务</span><span>四象限视图</span><span>可视化看板</span><span>顶级复盘</span><span class="active">时光列车</span><span>更多功能</span>
      </nav>
    </header>
    <p class="eyebrow">TIME TRAIN · DAILY JOURNEY</p>
    <div class="headline">
      <div><h1>今天，窗外是新的风景</h1><p class="subtitle">沿着真实的路，慢慢走过属于自己的每一天。</p></div>
      <span class="concept-tag">独立交互原型 · 本地保存</span>
    </div>
    <section class="carriage" aria-label="时光列车车窗">
      <div class="window" id="journey-window"><span class="glass-label" id="window-label">杭黄线 · 今日窗外</span><span class="light-caption" id="light-caption"></span></div>
      <div class="shelf">
        <div class="ticket" id="today-ticket" aria-label="今日车票">
          <div class="ticket-main"><div class="ticket-kicker" id="ticket-kicker">今日车票</div><div class="ticket-name" id="ticket-name"></div><div class="ticket-desc" id="ticket-desc"></div></div>
          <div class="ticket-side" id="ticket-date"></div>
        </div>
        <button class="journal-trigger" id="open-journal" type="button" aria-label="翻开今日旅途手账">
          <span class="journal-book" aria-hidden="true">旅途手账</span>
          <span class="journal-caption"><strong>翻开今日手账</strong><small>把今天留在这一站</small></span>
        </button>
      </div>
    </section>
    <div class="route-strip" aria-label="当前旅程进度">
      <span class="route-label">这一段旅程</span>
      <div class="route-line"><span id="route-origin">杭州东</span><span class="rail"></span><span class="station-dot" aria-hidden="true"></span><b id="route-today"></b><span class="rail"></span><span class="route-future" id="route-future">下一站 · 明日揭晓</span></div>
    </div>
    <div class="below"><div><h2>今天想带上的事</h2><p>给今天留一点方向，也给沿途留一点空白。</p></div><button class="today-button" id="open-journal-below" type="button">翻开今日手账 →</button></div>
  </main>
  <dialog id="journal-dialog" aria-label="今日旅途手账">
    <button class="journal-close" id="close-journal" type="button" aria-label="合上手账">×</button>
    <div class="journal-open">
      <section class="journal-page"><div class="journal-meta" id="journal-date"></div><h2 id="journal-title"></h2><p id="journal-narration"></p></section>
      <section class="journal-page"><div class="journal-meta">窗边一句 · 仅保存在这台浏览器</div><h2>留给今天的自己</h2><label class="note-label" for="journal-note">写一句今天的旅途感受</label><textarea id="journal-note" maxlength="160" placeholder="今天的风景让我想起……"></textarea><p class="save-status" id="save-status" role="status"></p></section>
    </div>
  </dialog>
  <script src="./journey-prototype.js?v=1.1.5"></script>
</body>
</html>
